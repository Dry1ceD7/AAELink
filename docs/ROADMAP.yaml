  0.0.43-alpha:
    status: planned
    theme: Inline-style cleanup round 2 + typing/presence WS migration
    items:
      - id: inline-style-round-2
        priority: P1
        title: WorkflowBuilder + LegalHoldPanel + EKMPanel + TicketingSettingsPanel inline-style sweep
        description: Reduce remaining inline style={{...}} blocks in four largest offenders
        audit_section: 1.2
        skills: [aaelink-ui-component]
      - id: typing-presence-ws
        priority: P1
        title: Migrate typing + presence to WebSocket
        description: Typing is HTTP polling today; presence has its own SSE stream. Both move onto the unified WS gateway.
        audit_section: 2.1
        skills: [aaelink-realtime]
      - id: home-shell-disable-presence-sse
        priority: P1
        title: Home shell skips legacy presence SSE / typing GET poll when WS gateway is active
        description: Reshape <TypingIndicator> and usePresenceListener to accept injected subscribers; route home-shell typing/presence WS events through the v0.0.43 applyTypingEvent / applyPresenceEvent helpers; remove the EventSource and GET poll on the WS-enabled path. Closes the deferred half of typing-presence-ws.
        audit_section: 2.1
        depends_on: [typing-presence-ws]
        skills: [aaelink-realtime, aaelink-ui-component]
        status: shipped
        shipped_on: 2026-05-20
      - id: replay-skip-ephemeral-topics
        priority: P1
        title: Replay store skips ephemeral topics
        description: Typing has an 8s TTL; replaying typing events on reconnect produces ghost typers. Add a topic-prefix or event-type filter to the replay store so typing events are not recorded.
        audit_section: 2.1
        depends_on: [typing-presence-ws]
        skills: [aaelink-realtime]
        status: shipped
        shipped_on: 2026-05-20
      - id: e2e-coverage-expansion
        priority: P1
        title: More E2E specs
        description: read_state, channel_update, thread reply, file upload, slash commands, RBAC denial
        audit_section: 1.3
        skills: [aaelink-testing]
      - id: migrate-monolith-split
        priority: P2
        title: lib/migrate.ts monolith → versioned migrations
        description: 2,380-line lib/migrate.ts split into versioned files using v0.0.57's migrationRunner
        audit_section: 2.2
        skills: [aaelink-overview]
      - id: styles-css-split
        priority: P2
        title: app/styles.css split
        description: 17,696-line monolith → per-feature CSS files
        audit_section: 2.4
        skills: [aaelink-ui-component]
      - id: zod-typed-bodies
        priority: P2
        title: Zod-typed bodies for OpenAPI
        description: Generator captures method/path today; typed handler bodies enable richer schemas
        audit_section: 2.5
        skills: [aaelink-api-route]
      - id: gateway-rate-limit
        priority: P2
        title: Gateway-side rate limiting + topic allowlist
        description: Per-connection inbound frame rate limit, max-subscriptions cap, and topic allowlist on the WS gateway. Bounds a misbehaving client and prevents arbitrary topic subscribes (the topic field added in ADR-0002 was previously unbounded).
        skills: [aaelink-realtime]
        status: shipped
        shipped_on: 2026-05-20

