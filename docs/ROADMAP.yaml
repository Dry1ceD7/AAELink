  post-ga:
    status: planned
    milestone: M8+
    theme: BLUEPRINT § 4 / § 5 architectural decomposition
    items:
      # Architectural drifts — DRIFT-002, 003, 004, 005, 006, 007, 008, 019
      - id: messaging-svc-extraction
        priority: P1
        milestone: M5
        title: Extract messaging-svc microservice (BLUEPRINT § 4.3)
        description: First service extracted from the Next.js BFF monolith. Closes DRIFT-002 partially.
        adr: docs/ADR/0009-postgres-to-scylla-messages-migration.md
        skills: [aaelink-overview, aaelink-realtime]
      - id: realtime-gw-extraction
        priority: P1
        milestone: M5
        title: Extract Elixir/OTP realtime gateway (BLUEPRINT § 4.4)
        description: Replace the Next.js /api/ws bridge with the Elixir/OTP gateway target — ≥ 2M concurrent WS / region, NATS option, Kafka per-workspace partitioning.
        adr: docs/ADR/0011-elixir-otp-realtime-gateway.md
        depends_on: [redis-fanout-scale]
        skills: [aaelink-realtime]
      - id: scylla-messages-migration
        priority: P1
        milestone: M6
        title: Migrate messages store from Postgres to ScyllaDB (BLUEPRINT § 4.5)
        description: Write-optimized, 1M+ ops/sec/node target. Closes DRIFT-004.
