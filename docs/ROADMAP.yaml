# AAELink — Machine-readable roadmap
#
# Companion to docs/ROADMAP.md (narrative) and docs/BLUEPRINT.md (architecture).
# Agents read this file to verify a proposed feature or story belongs to the
# version milestone it claims. /aae-blueprint-align consults it during the
# roadmap-version alignment check.
#
# Schema (informal):
#   current_version: string                     # the version being worked on
#   versions:
#     <semver>:
#       status: shipped | in-progress | planned
#       theme: short string                     # one-liner for the milestone
#       items:
#         - id: kebab-case slug
#           priority: P0 | P1 | P2
#           title: short string
#           description: longer string
#           audit_section: string (optional)    # link back to audit-YYYY-MM-DD.md sections
#           skills: [list of aaelink-* / bmad-* skill names that own this item]
#           depends_on: [list of item ids]      # items in this or a prior version
#
# When a release ships, flip its status to `shipped` and add a `shipped_on`
# date. Do not delete entries — history is part of the contract.

schema_version: 1
