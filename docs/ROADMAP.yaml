  # ─────────────────────────────────────────────────────────────────────
  # post_ga — BLUEPRINT § 4 / § 5 architectural targets the alpha line does
  # not yet ship. Audit-2026-05-26 CHG-010 closes 11 of 26 DRIFT findings by
  # registering these here. Each item gets an ADR for the foundational
  # decision. M0..M8 milestones map to BLUEPRINT § 6.1 76-week plan.
