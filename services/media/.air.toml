# Air — hot reload for Go (development only)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/auth ./cmd/server"
  bin = "./tmp/auth"
  full_bin = "./tmp/auth"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  delay = 1000
  kill_delay = "0.5s"
  rerun = false
  rerun_delay = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
