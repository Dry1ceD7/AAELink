apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: mattermost
spec:
  # Single replica for local dev — no need for HA clustering on Docker Desktop
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:latest
          # Image is amd64-only; pre-pull with: docker pull --platform linux/amd64 mattermost/mattermost-team-edition:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8065
          env:
            - name: MM_SERVICESETTINGS_SITEURL
              value: http://localhost:30065
            - name: MM_SERVICESETTINGS_LISTENADDRESS
              value: :8065
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-secrets
                  key: datasource
            # Clustering disabled for single-replica dev
            - name: MM_CLUSTERSETTINGS_ENABLE
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
# NodePort service — Mattermost available at localhost:30065
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: mattermost
spec:
  type: NodePort
  selector:
    app: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: http
      nodePort: 30065
