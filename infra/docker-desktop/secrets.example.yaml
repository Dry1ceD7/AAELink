# ──────────────────────────────────────────────────────────────────────────────
# AAELink Kubernetes Secrets — Example / Template
# ──────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   1. Copy this file to secrets.yaml:     cp secrets.example.yaml secrets.yaml
#   2. Fill in real credentials below
#   3. Apply:                              kubectl apply -f secrets.yaml
#
# ⚠️  DO NOT commit secrets.yaml to version control.
#     (it's listed in .gitignore)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: aaelink-db
  namespace: aaelink
  labels:
    app.kubernetes.io/name: aaelink
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # PostgreSQL credentials
  postgres-user: aaelink
  postgres-password: replace-me-with-strong-password
  datasource: postgres://aaelink:replace-me-with-strong-password@postgres.aaelink.svc.cluster.local:5432/aaelink?sslmode=disable&connect_timeout=10
---
apiVersion: v1
kind: Secret
metadata:
  name: aaelink-web
  namespace: aaelink
  labels:
    app.kubernetes.io/name: aaelink
    app.kubernetes.io/component: web
type: Opaque
stringData:
  # ── Database ───────────────────────────────────────────────────────────────
  DATABASE_URL: postgres://aaelink:replace-me-with-strong-password@postgres.aaelink.svc.cluster.local:5432/aaelink?sslmode=disable

  # ── Object Storage (MinIO / S3) ────────────────────────────────────────────
  S3_ENDPOINT: http://minio.aaelink.svc.cluster.local:9000
  S3_ACCESS_KEY: replace-minio-access-key
  S3_SECRET_KEY: replace-minio-secret-key
  S3_BUCKET: aaelink-documents
  S3_REGION: us-east-1

  # ── PDF Processing ─────────────────────────────────────────────────────────
  STIRLING_URL: http://stirling-pdf.aaelink.svc.cluster.local:8080

  # ── Session Security ───────────────────────────────────────────────────────
  # Set to 'true' in production to require HTTPS for session cookies
  SESSION_COOKIE_SECURE: "false"

  # ── Optional: Microsoft Entra SSO ──────────────────────────────────────────
  # Uncomment and fill in for Azure AD / Entra ID integration
  # ENTRA_CLIENT_ID: ""
  # ENTRA_CLIENT_SECRET: ""
  # ENTRA_TENANT_ID: ""
  # ENTRA_REDIRECT_URI: "https://your-domain.com/api/auth/entra"

  # ── Optional: GitHub App (for update checks) ──────────────────────────────
  # GITHUB_REPO: "org/repo"
  # GITHUB_TOKEN: ""
