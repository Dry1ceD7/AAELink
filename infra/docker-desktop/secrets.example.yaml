# Copy to secrets.yaml, fill in real values, then: kubectl apply -f secrets.yaml
# DO NOT commit secrets.yaml to git.
apiVersion: v1
kind: Secret
metadata:
  name: aaelink-db
  namespace: aaelink
type: Opaque
stringData:
  postgres-user: aaelink
  postgres-password: replace-me
  datasource: postgres://aaelink:replace-me@postgres.aaelink.svc.cluster.local:5432/aaelink?sslmode=disable&connect_timeout=10
---
apiVersion: v1
kind: Secret
metadata:
  name: aaelink-web
  namespace: aaelink
type: Opaque
stringData:
  DATABASE_URL: postgres://aaelink:replace-me@postgres.aaelink.svc.cluster.local:5432/aaelink?sslmode=disable
  S3_ENDPOINT: http://minio.aaelink.svc.cluster.local:9000
  S3_ACCESS_KEY: replace-minio-access
  S3_SECRET_KEY: replace-minio-secret
  S3_BUCKET: aaelink-documents
  S3_REGION: us-east-1
  STIRLING_URL: http://stirling-pdf.aaelink.svc.cluster.local:8080
