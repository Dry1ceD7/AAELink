apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: aaelink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: frooodle/s-pdf:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: SECURITY_ENABLE_LOGIN
              value: "false"
            - name: SECURITY_ENABLE_API_KEY
              value: "false"
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "false"
            - name: LANGS
              value: en_US
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxMetaspaceSize=256m -XX:+UseContainerSupport"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
# Stirling PDF — available at localhost:30885
apiVersion: v1
kind: Service
metadata:
  name: stirling-pdf
  namespace: aaelink
spec:
  type: NodePort
  selector:
    app: stirling-pdf
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30885
