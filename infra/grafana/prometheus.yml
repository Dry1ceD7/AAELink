# AAELink Prometheus Configuration
# Place in /etc/prometheus/prometheus.yml or mount via K8s ConfigMap

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'aaelink'
    metrics_path: '/api/admin/prometheus'
    scheme: 'http'
    static_configs:
      - targets: ['localhost:3000']
        labels:
          env: 'production'
          service: 'aaelink-web'

