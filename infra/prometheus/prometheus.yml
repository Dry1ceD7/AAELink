global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'aaelink'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'aaelink-auth'
    static_configs:
      - targets: ['auth:8001']
    metrics_path: /metrics

  - job_name: 'aaelink-ticket'
    static_configs:
      - targets: ['ticket:8002']
    metrics_path: /metrics

  - job_name: 'aaelink-notify'
    static_configs:
      - targets: ['notify:8003']
    metrics_path: /metrics

  - job_name: 'aaelink-media'
    static_configs:
      - targets: ['media:8004']
    metrics_path: /metrics

  - job_name: 'aaelink-support'
    static_configs:
      - targets: ['support:8005']
    metrics_path: /metrics

  - job_name: 'aaelink-documents'
    static_configs:
      - targets: ['documents:8006']
    metrics_path: /metrics

  # NOTE: NATS Prometheus metrics require the prometheus-nats-exporter
  # sidecar; the embedded :8222 endpoint exposes /varz JSON only.
  # Skip until exporter is added.

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
