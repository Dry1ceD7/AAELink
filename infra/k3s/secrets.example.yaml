apiVersion: v1
kind: Secret
metadata:
  name: mattermost-secrets
  namespace: mattermost
type: Opaque
stringData:
  postgres-user: mattermost
  postgres-password: replace-me
  datasource: postgres://mattermost:replace-me@postgres.mattermost.svc.cluster.local:5432/mattermost?sslmode=disable&connect_timeout=10
---
apiVersion: v1
kind: Secret
metadata:
  name: aaelink-web
  namespace: aaelink
type: Opaque
stringData:
  MATTERMOST_URL: http://mattermost.mattermost.svc.cluster.local:8065
  MATTERMOST_WS_URL: ws://mattermost.mattermost.svc.cluster.local:8065/api/v4/websocket
  DATABASE_URL: postgres://mattermost:replace-me@postgres.mattermost.svc.cluster.local:5432/mattermost?sslmode=disable
  S3_ENDPOINT: http://minio.aaelink.svc.cluster.local:9000
  S3_ACCESS_KEY: replace-minio-access
  S3_SECRET_KEY: replace-minio-secret
  S3_BUCKET: aaelink-documents
  S3_REGION: us-east-1
  STIRLING_URL: http://stirling-pdf.aaelink.svc.cluster.local:8080
