apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: mattermost
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:latest
          ports:
            - name: http
              containerPort: 8065
          env:
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://aaelink.local
            - name: MM_SERVICESETTINGS_LISTENADDRESS
              value: :8065
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-secrets
                  key: datasource
            - name: MM_CLUSTERSETTINGS_ENABLE
              value: "true"
            - name: MM_CLUSTERSETTINGS_CLUSTERNAME
              value: aaelink
            - name: MM_CLUSTERSETTINGS_GOSSIPPORT
              value: "8074"
            - name: MM_CLUSTERSETTINGS_STREAMINGPORT
              value: "8075"
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
          livenessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: mattermost
spec:
  selector:
    app: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mattermost-pdb
  namespace: mattermost
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mattermost
