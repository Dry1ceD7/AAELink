apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mattermost
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
