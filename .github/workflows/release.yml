name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: |
              desktop/dist/*.dmg
          - os: windows-latest
            artifact_glob: |
              desktop/dist/*Setup*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        shell: bash

      - name: Build (mac)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no electron-builder --mac --publish=never

      - name: Build (windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no electron-builder --win --publish=never

      - name: Prune unwanted artifacts
        shell: bash
        working-directory: desktop/dist
        run: |
          # Keep only .dmg (mac) and Setup *.exe (windows). Drop zip / blockmap / portable / yml.
          rm -f *.zip *.blockmap latest*.yml
          ls -lah || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f | sort

      - name: Resolve release notes file
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          file="docs/release-notes/${tag}.md"
          if [ ! -f "$file" ]; then
            file="docs/release-notes/latest.md"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Using notes: $file"

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*Setup*.exe
