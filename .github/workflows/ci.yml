name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://aaelink:aaelink@127.0.0.1:5432/aaelink
          AAELINK_OPEN_REGISTRATION: '1'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: aaelink-documents
          S3_REGION: us-east-1
          STIRLING_URL: http://127.0.0.1:8080
