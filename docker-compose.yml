name: aaelink-clean

services:
  postgres:
    # 17 matches existing named volumes from earlier setups; use a fresh volume before moving to 18+.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aaelink
      POSTGRES_USER: aaelink
      POSTGRES_PASSWORD: aaelink
    ports:
      - "25432:5432"
      - "30432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aaelink']
      interval: 10s
      timeout: 5s
      retries: 10

  stirling-pdf:
    image: frooodle/s-pdf:latest
    platform: linux/amd64
    environment:
      DOCKER_ENABLE_SECURITY: 'false'
      SECURITY_ENABLE_LOGIN: 'false'
      SECURITY_ENABLE_API_KEY: 'false'
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: 'false'
      LANGS: en_US
    ports:
      - '28085:8080'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '29000:9000'
      - '29001:9001'
    volumes:
      - minio-data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '26379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  redis-data:
