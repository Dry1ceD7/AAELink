version: '3'

vars:
  COMPOSE: docker compose
  SERVICES: auth ticket notify media

tasks:
  # ─── Dev lifecycle ──────────────────────────────────────────
  up:
    desc: Start all infrastructure + services (local dev)
    cmds:
      - "{{.COMPOSE}} up -d"
      - task: logs:follow

  down:
    desc: Stop all containers
    cmds:
      - "{{.COMPOSE}} down"

  restart:
    desc: Restart all containers
    cmds:
      - "{{.COMPOSE}} restart"

  reset:
    desc: "⚠ DESTROY all containers + volumes and restart fresh"
    prompt: This will delete all local data. Continue?
    cmds:
      - "{{.COMPOSE}} down -v --remove-orphans"
      - "{{.COMPOSE}} up -d"

  logs:
    desc: Tail logs for a service (task logs -- auth)
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  logs:follow:
    desc: Follow all logs
    cmds:
      - "{{.COMPOSE}} logs -f"

  # ─── Database ───────────────────────────────────────────────
  migrate:up:
    desc: Run all pending migrations
    dir: migrations
    cmds:
      - task: migrate:up:auth
      - task: migrate:up:ticket

  migrate:up:auth:
    desc: Migrate auth database
    cmds:
      - >
        docker run --rm --network aaelink-net
        -v {{.ROOT_DIR}}/migrations/auth:/migrations
        migrate/migrate
        -path=/migrations
        -database="postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@postgres:5432/{{.POSTGRES_DB_AUTH}}?sslmode=disable"
        up
    vars:
      POSTGRES_USER:
        sh: grep POSTGRES_USER .env | cut -d= -f2
      POSTGRES_PASSWORD:
        sh: grep POSTGRES_PASSWORD .env | cut -d= -f2
      POSTGRES_DB_AUTH:
        sh: grep POSTGRES_DB_AUTH .env | cut -d= -f2

  migrate:up:ticket:
    desc: Migrate ticket database
    cmds:
      - >
        docker run --rm --network aaelink-net
        -v {{.ROOT_DIR}}/migrations/ticket:/migrations
        migrate/migrate
        -path=/migrations
        -database="postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@postgres:5432/{{.POSTGRES_DB_TICKET}}?sslmode=disable"
        up
    vars:
      POSTGRES_USER:
        sh: grep POSTGRES_USER .env | cut -d= -f2
      POSTGRES_PASSWORD:
        sh: grep POSTGRES_PASSWORD .env | cut -d= -f2
      POSTGRES_DB_TICKET:
        sh: grep POSTGRES_DB_TICKET .env | cut -d= -f2

  migrate:down:
    desc: Rollback last migration (task migrate:down -- auth)
    cmds:
      - echo "Use task migrate:down:auth or task migrate:down:ticket"

  # ─── Code generation ────────────────────────────────────────
  sqlc:generate:
    desc: Generate Go code from SQL queries (all services)
    cmds:
      - for: [auth, ticket]
        cmd: cd services/{{.ITEM}} && sqlc generate

  # ─── Tests ──────────────────────────────────────────────────
  test:
    desc: Run all Go tests
    cmds:
      - for: {var: SERVICES}
        cmd: cd services/{{.ITEM}} && go test -race ./... -count=1

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - for: {var: SERVICES}
        cmd: cd services/{{.ITEM}} && go test -race -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html

  # ─── Lint ───────────────────────────────────────────────────
  lint:
    desc: Run golangci-lint on all services
    cmds:
      - for: {var: SERVICES}
        cmd: cd services/{{.ITEM}} && golangci-lint run ./...

  # ─── Build ──────────────────────────────────────────────────
  build:
    desc: Build all Docker images locally
    cmds:
      - "{{.COMPOSE}} build"

  # ─── Shortcuts ──────────────────────────────────────────────
  ps:
    desc: Show running containers
    cmds:
      - "{{.COMPOSE}} ps"

  shell:
    desc: Open shell in a service container (task shell -- auth)
    cmds:
      - "{{.COMPOSE}} exec {{.CLI_ARGS}} sh"

  psql:
    desc: Open psql on auth db
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U aaelink -d aaelink_auth"

  redis:
    desc: Open redis-cli
    cmds:
      - "{{.COMPOSE}} exec redis redis-cli"
